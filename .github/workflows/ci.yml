name: ci

on:
  push: { branches: [main] }
  pull_request:
  # The merge queue's run of the same checks (pubkit protect turns the queue on).
  merge_group:

jobs:
  ci:
    uses: Sustenaut/pubkit/.github/workflows/python-ci.yml@7914b2abb933747e303f5f981d8335d3704dcdb3 # v0.21.0
    # By name: secrets: inherit reaches no workflow of another owner.
    secrets: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
